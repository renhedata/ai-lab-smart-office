name: 采购申请
description: 记录设备、材料或服务的采购决策。
title: "[采购] "
labels: ["enhancement"]
body:
  - type: input
    id: related
    attributes:
      label: 关联需求与决策
      placeholder: NEED-___ / DEC-___
      description: 没有已验证需求和批准试点成本上限的 DEC，不进入采购。
    validations:
      required: true
  - type: input
    id: item
    attributes:
      label: 设备或材料名称
      placeholder: 例如：PoE 交换机
    validations:
      required: true
  - type: textarea
    id: purpose
    attributes:
      label: 用途与安装位置
      placeholder: 用于哪个区域、解决哪个需求、与哪些系统关联？
    validations:
      required: true
  - type: textarea
    id: options
    attributes:
      label: 候选能力与脱敏比较
      description: 写设备类别、关键能力、预算区间和比较结论；报价单、合同、联系人和订单放内部系统，只引用记录编号。
      placeholder: 候选类别、预算区间、交期区间、保修和接口/协议兼容性。
    validations:
      required: true
  - type: textarea
    id: operations
    attributes:
      label: 本地使用与长期运维
      description: 说明断网/平台停机/断电恢复行为，状态反馈，安全更新期限，备份、替换和供应商退出方式。
      placeholder: 本地开关是否仍可用？数据/配置能否导出？何时停止安全更新？
    validations:
      required: true
  - type: textarea
    id: pilot
    attributes:
      label: 试点指标、期限与回退
      description: 写基线、目标、最小数量、试点时长、暂停条件以及设备退换/复用方式。
    validations:
      required: true
  - type: textarea
    id: data
    attributes:
      label: 数据与网络边界
      description: 只写数据类别、是否出网、接收方类别、保存期和访问方向；精确 VLAN、IP、端口、域名及配置放内部系统并填写记录编号。
    validations:
      required: true
  - type: input
    id: internal_record
    attributes:
      label: 内部采购 / 资产记录编号
      description: 不粘贴内部链接中的敏感内容；尚未建立时写“待建立”。
    validations:
      required: true
  - type: input
    id: budget
    attributes:
      label: 预算金额
      placeholder: CNY 0.00
    validations:
      required: true
  - type: textarea
    id: approval
    attributes:
      label: 最终选择与批准记录
      description: 尚未批准时写“待审批”，批准后关联 DEC 并更新此项。
      placeholder: 选择理由、批准角色、相关 NEED、DEC、Discussion 或 Pull Request 链接。
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: 发布边界确认
      options:
        - label: 我没有提交合同、联系人、订单、凭证、精确资产/网络配置或其他内部资料。
          required: true
