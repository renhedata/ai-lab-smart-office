name: 提供一个方案
description: 用几句话说清问题和做法即可。
title: "[方案] "
body:
  - type: markdown
    attributes:
      value: |
        不需要会写代码或完整文档。说明要解决的问题和你的做法，项目组会继续整理。
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题？
      description: 在什么场景下，现在有什么不便？
      placeholder: 例如：会议开始前，需要分别找灯、窗帘和屏幕遥控器。
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 你的方案是什么？
      description: 写清做法即可；设备、流程或自动化都可以。
      placeholder: 例如：在门口增加一个“会议”按键，一次设置灯光、窗帘和屏幕。
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: 补充信息（可选）
      description: 可以补充预期效果、参考链接、预算或现场限制。
  - type: checkboxes
    id: safety
    attributes:
      label: 提交前确认
      options:
        - label: 我没有填写密码、门禁凭证、个人信息或内部网络细节。
          required: true
