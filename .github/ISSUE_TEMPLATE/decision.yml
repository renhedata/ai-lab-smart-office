name: 决策记录（项目组）
description: 保留一项重要选择、拒绝、暂缓、替代或退役的依据与后果。
title: "[DEC] "
labels: ["documentation"]
body:
  - type: dropdown
    id: status
    attributes:
      label: 决策状态
      options:
        - Proposed
        - Accepted
        - Rejected
        - Superseded
        - Retired
    validations:
      required: true
  - type: input
    id: owner
    attributes:
      label: 决策负责人 / 授权角色
      placeholder: 角色或团队；公开记录不必写个人联系方式
    validations:
      required: true
  - type: input
    id: related
    attributes:
      label: 关联需求 / 试点 / 变更
      placeholder: NEED-___ / EXP-___ / Issue #___
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 背景与证据
      description: 引用现场观察、基线、试点指标和员工反馈。
    validations:
      required: true
  - type: textarea
    id: options
    attributes:
      label: 考虑过的选项
      description: 包括“不做”和更简单的方案。
    validations:
      required: true
  - type: textarea
    id: decision
    attributes:
      label: 最终决定与理由
    validations:
      required: true
  - type: textarea
    id: tradeoffs
    attributes:
      label: 成本、运维、隐私、安全、无障碍和供应商锁定取舍
    validations:
      required: true
  - type: textarea
    id: dissent
    attributes:
      label: 反对意见或未解疑虑
      description: 没有时写“无”，不删除未被采纳的观点。
    validations:
      required: true
  - type: textarea
    id: followup
    attributes:
      label: 成功指标、回退条件和复核日期
    validations:
      required: true
  - type: input
    id: superseded_by
    attributes:
      label: 被哪个新决策替代（如适用）
      placeholder: DEC-___；不适用时留空
  - type: checkboxes
    id: safety
    attributes:
      label: 发布边界确认
      options:
        - label: 证据和取舍均为公开或已脱敏摘要，原始内部资料只通过记录编号引用。
          required: true
