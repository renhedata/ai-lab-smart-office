<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" role="img" aria-labelledby="title desc">
  <title id="title">AI实验室本地自动化控制架构</title>
  <desc id="desc">墙面开关、传感器和管理端通过本地控制平台、DALI、Modbus、KNX 与 Zigbee 控制灯光、窗帘、空调和能耗设备。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#ecfeff"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#64748b"/>
    </marker>
    <style>
      .title { font: 700 30px 'PingFang SC','Microsoft YaHei',sans-serif; fill: #0f172a; }
      .subtitle { font: 400 16px 'PingFang SC','Microsoft YaHei',sans-serif; fill: #475569; }
      .label { font: 600 18px 'PingFang SC','Microsoft YaHei',sans-serif; fill: #0f172a; text-anchor: middle; }
      .small { font: 400 14px 'PingFang SC','Microsoft YaHei',sans-serif; fill: #475569; text-anchor: middle; }
      .box { stroke-width: 2; rx: 14; }
      .input { fill: #eff6ff; stroke: #3b82f6; }
      .core { fill: #ecfdf5; stroke: #0f766e; }
      .bus { fill: #fff7ed; stroke: #f97316; }
      .output { fill: #faf5ff; stroke: #8b5cf6; }
      .line { fill: none; stroke: #64748b; stroke-width: 2.5; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1400" height="620" fill="url(#bg)"/>
  <text x="48" y="52" class="title">AI实验室本地自动化控制架构</text>
  <text x="48" y="82" class="subtitle">固定设备有线控制 · 传感器无线补充 · 手动控制永远优先 · 平台离线仍可用</text>

  <rect x="45" y="125" width="230" height="78" class="box input"/>
  <text x="160" y="157" class="label">墙面开关 / 场景面板</text>
  <text x="160" y="182" class="small">本地输入与手动兜底</text>

  <rect x="45" y="235" width="230" height="78" class="box input"/>
  <text x="160" y="267" class="label">存在 / 照度 / 环境</text>
  <text x="160" y="292" class="small">有线优先，Zigbee 补充</text>

  <rect x="45" y="345" width="230" height="78" class="box input"/>
  <text x="160" y="377" class="label">日程 / 网页 / 手机</text>
  <text x="160" y="402" class="small">管理、状态与人工场景</text>

  <rect x="380" y="175" width="280" height="190" class="box core"/>
  <text x="520" y="220" class="label">Home Assistant</text>
  <text x="520" y="252" class="small">本地场景与状态管理</text>
  <text x="520" y="282" class="small">MQTT / Zigbee2MQTT</text>
  <text x="520" y="312" class="small">规则、仪表盘、告警</text>
  <text x="520" y="342" class="small">机房部署 + UPS</text>

  <rect x="760" y="120" width="240" height="82" class="box bus"/>
  <text x="880" y="152" class="label">DALI-2 照明总线</text>
  <text x="880" y="178" class="small">驱动、按钮、存在与照度</text>

  <rect x="760" y="230" width="240" height="82" class="box bus"/>
  <text x="880" y="262" class="label">KNX / Modbus</text>
  <text x="880" y="288" class="small">窗帘、空调、能耗计量</text>

  <rect x="760" y="340" width="240" height="82" class="box bus"/>
  <text x="880" y="372" class="label">Zigbee / Thread</text>
  <text x="880" y="398" class="small">低功耗传感器与辅助设备</text>

  <rect x="1110" y="120" width="240" height="82" class="box output"/>
  <text x="1230" y="152" class="label">灯光与调光</text>
  <text x="1230" y="178" class="small">分区、日光补偿、场景</text>

  <rect x="1110" y="230" width="240" height="82" class="box output"/>
  <text x="1230" y="262" class="label">窗帘与空调</text>
  <text x="1230" y="288" class="small">遮阳、温控、会议联动</text>

  <rect x="1110" y="340" width="240" height="82" class="box output"/>
  <text x="1230" y="372" class="label">告警与能耗</text>
  <text x="1230" y="398" class="small">漏水、空气质量、分项计量</text>

  <path d="M275 164H350V220H380" class="line"/>
  <path d="M275 274H380" class="line"/>
  <path d="M275 384H350V320H380" class="line"/>
  <path d="M660 225H720V161H760" class="line"/>
  <path d="M660 270H760" class="line"/>
  <path d="M660 315H720V381H760" class="line"/>
  <path d="M1000 161H1110" class="line"/>
  <path d="M1000 271H1110" class="line"/>
  <path d="M1000 381H1110" class="line"/>

  <rect x="45" y="475" width="1305" height="100" rx="16" fill="#0f172a"/>
  <text x="700" y="510" class="label" fill="#ffffff" style="fill:#fff">网络与安全边界</text>
  <text x="700" y="542" class="small" fill="#cbd5e1" style="fill:#cbd5e1">VLAN 30 自动化服务（建议新增）管理 VLAN 20 IoT；员工网仅访问 HTTPS 控制面板；设备默认不直通互联网</text>
  <text x="700" y="566" class="small" fill="#94a3b8" style="fill:#94a3b8">消防、应急照明、门禁生命安全功能保持独立，不由普通自动化规则直接控制</text>
</svg>
